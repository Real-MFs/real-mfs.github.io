<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real[MFS]</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #1a0000, #050507);
  color: #e6e6e6;
  text-align: center;
}

.header {
  padding: 60px 20px 30px;
}

.header img {
  width: 90px;
  margin-bottom: 15px;
}

.header h1 {
  margin: 0;
  font-size: 40px;
  color: #ff3c3c;
  letter-spacing: 3px;
}

.header p {
  margin-top: 10px;
  color: #888;
  font-size: 14px;
}

.main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(20,20,25,0.85);
  border: 1px solid rgba(255,0,0,0.2);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  backdrop-filter: blur(6px);
  transition: 0.3s;
}

.card:hover {
  border-color: rgba(255,60,60,0.5);
  box-shadow: 0 0 25px rgba(255,0,0,0.15);
}

.card h2 {
  color: #ff4d4d;
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 15px;
  margin-top: 0;
}

.stat {
  margin: 8px 0;
  font-size: 14px;
}

.rules {
  font-size: 13px;
  color: #bbb;
  line-height: 1.6;
}

.tools {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tool {
  display: block;
  text-decoration: none;
  padding: 12px;
  border-radius: 6px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,0,0,0.1);
}

.tool span {
  display: block;
  color: #ff4d4d;
}

.tool small {
  color: #888;
  font-size: 12px;
}

/* RECRUITMENT */
.recruiting-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #00ff88;
  border-radius: 50%;
  margin-left: 8px;
  animation: blink 1.2s infinite;
}

@keyframes blink {
  50% { opacity: 0.2; }
}

.recruiting-text {
  font-size: 11px;
  color: #00ff88;
}

.full-text {
  font-size: 11px;
  color: #ff4444;
}

.btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 30px;
  background: linear-gradient(90deg, #ff2a2a, #8b0000);
  border-radius: 6px;
  text-decoration: none;
  color: white;
  font-weight: bold;
}

footer {
  margin-top: 40px;
  padding: 20px;
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<div class="header">
  <img src="https://www.citypng.com/public/uploads/preview/hd-dota-2-official-logo-png-701751694788589vbfyq561nz.png">
  <h1 id="guildName"></h1>
  <p id="tagline"></p>
</div>

<div class="main">

  <div class="card">
    <h2>GUILD</h2>
    <div class="quote" id="quote"></div>
    <div class="stat" id="region"></div>
    <div class="stat" id="members"></div>
    <div id="recruitmentStatus"></div>

  
  </div>

  <div class="card">
    <h2>WHO WE ARE</h2>
    <div class="rules">
      Real MFs only.<br>
      Active players. No excuses.<br>
      Contracts completed daily.<br>
      We win lanes. We take towers. We end games.
    </div>
  </div>

  <div class="card">
    <h2>REQUIREMENTS</h2>
    <div class="rules">
      • Stay active<br>
      • Complete guild contracts<br>
      • No inactivity<br>
      • Respect the grind
    </div>
  </div>

  <div class="card">
    <h2>DOTA 2 TOOLS</h2>
    <div class="tools" id="tools"></div>
  </div>

  <div class="card">
    <h2>JOIN</h2>
    <a id="discordBtn" class="btn" target="_blank">ENTER DISCORD</a>
  </div>

</div>

<footer>
  © REAL[MFS] — Built different.
</footer>

<script src="assets/info.js"></script>

<script>
const data = guildData;

// Basic info
document.getElementById("guildName").textContent = data.name;
document.getElementById("tagline").textContent = data.tagline;
document.getElementById("region").textContent = data.region;
document.getElementById("quote").textContent = data.quote;

// Members
const membersEl = document.getElementById("members");
membersEl.innerHTML = `${data.members.current} / ${data.members.max} Members`;

const statusEl = document.getElementById("recruitmentStatus");

if (data.members.current < data.members.max) {
  membersEl.innerHTML += `<span class="recruiting-dot"></span>`;
  statusEl.innerHTML = `<div class="recruiting-text">Recruitment Active</div>`;
} else {
  statusEl.innerHTML = `<div class="full-text">Guild is currently full</div>`;
}

// Tools
const toolsContainer = document.getElementById("tools");

data.tools.forEach(tool => {
  const el = document.createElement("a");
  el.href = tool.link;
  el.target = "_blank";
  el.className = "tool";

  el.innerHTML = `
    <span>${tool.name}</span>
    <small>${tool.desc}</small>
  `;

  toolsContainer.appendChild(el);
});

// Discord
document.getElementById("discordBtn").href = data.discord;
</script>

</body>
</html>
